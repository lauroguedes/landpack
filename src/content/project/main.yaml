# Preview frame: arc (border only, default), browser (glass with toolbar), or safari (compact).
# preview.address controls the decorative URL shown in browser and safari frames.
name: Laravel SSO
shortName: laravel sso
description:
  A self-hosted OpenID Connect provider built on Laravel. Register your applications, and
  sign in to all of them with one account.
eyebrow: RUN YOUR OWN IDENTITY PROVIDER
headline: Your identity.
headlineAccent: Your infrastructure.
intro: A complete OpenID Connect provider you can actually read. One account, one sign-in page, and applications that never see a password.
command: laravel new my-sso --using=lauroguedes/laravel-sso
repository: https://github.com/lauroguedes/laravel-sso
docs: https://laravel-sso.lauroguedes.dev/docs
demo: https://laravel-sso.lauroguedes.dev
license: MIT
author: Lauro Guedes
authorUrl: https://lauroguedes.dev
stats:
  - value: 514 tests
    label: SQLite, MySQL, PostgreSQL
    href: https://github.com/lauroguedes/laravel-sso/actions/workflows/ci.yml
  - value: OpenID Connect
    label: Standards, not lock-in
  - value: MIT
    label: Commercial use included
  - value: PHP 8.3+
    label: Laravel 13, Inertia, Vue 3
featuresHeading: |-
  Everything identity needs.
  Nothing it doesn’t.
featuresIntro: The whole protocol surface, and the interface to run it day to day. Read the code, change what you need, deploy it as your own.
setupHeading: From clone to connected.
setupIntro: Three commands to your own identity provider. No vendor account, no hosted tier to graduate from.
setupNote:
  The installer generates your signing keys, seeds the platform roles, offers to create
  your first administrator, and prints the endpoints your applications need. It is safe to
  run again.
integrationsHeading: Your stack. Already invited.
integrationsIntro:
  Register an application and hand its developer the issuer and its credentials. Most
  libraries need nothing else — they read the rest from the discovery document. Nothing on
  the other end has to be Laravel. Or even PHP.
ctaHeading: Start with one command.
ctaIntro: Clone it, read it, deploy it. From here, the identity layer is one more application you own.
