highlights:
  - eyebrow: BUILT ON OPEN STANDARDS
    title: |-
      One sign-in.
      Every application.
    description:
      Your users get one account and one familiar sign-in page. Your applications get a
      signed identity, standard tokens, and no password to store.
    graphic: flow
  - eyebrow: PERMISSIONS WITH BOUNDARIES
    title: |-
      The right access.
      In the right hands.
    description:
      Every application defines its own roles. Tokens carry only the roles a user holds
      there, so one app never learns about another.
    graphic: roles
    image: ../../assets/screenshots/user-access.png
    imageAlt:
      "Users with access: Ada Admin has the Analyst role, while Alan Turing and Grace Hopper
      have Viewer access."
